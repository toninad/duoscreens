name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/tests _site/supabase _site/.github
          # Bust browser caches: stylesheet and script URLs change with every deploy.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html
          sed -i -E "s#(from '\./[a-z]+\.js)'#\1?v=${GITHUB_SHA::7}'#g" _site/src/*.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
